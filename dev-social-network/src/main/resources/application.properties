spring.application.name=dev-social-network

spring.config.import=optional:file:.env[.properties],optional:file:dev-social-network/.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:codefactory}
spring.datasource.username=${DB_USERNAME:codefactory}
spring.datasource.password=${DB_PASSWORD:codefactory}

# No auto-gestionar Docker Compose (el contenedor ya se levanta manualmente)
spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Clave de firma de los tokens JWT. Sale del .env (ver .env.example).
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-ttl-minutos=${APP_JWT_ACCESS_TTL_MINUTOS:15}

server.port=${SERVER_PORT:8083}