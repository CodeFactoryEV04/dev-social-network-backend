# ============================================================
# Configuracion de SonarCloud
#
# OJO: `mvnw sonar:sonar` NO lee este archivo; la configuracion real
# esta en <properties> del pom.xml. Este archivo solo aplica al SonarScanner CLI.
#
# Uso:
#   mvnw clean verify sonar:sonar -Dsonar.token=XXX


sonar.organization=xiomarag55
sonar.host.url=https://sonarcloud.io
sonar.projectKey=xiomarag55_dev-social-network-backend
sonar.projectName=dev-social-network-backend
sonar.projectVersion=0.0.1

# Estructura del proyecto
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.source=21

# El paquete de tests es de Spring Boot y solo valida que el contexto carga.
# El analisis se hace sobre el XML de JaCoCo generado por `mvnw verify`.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Documentacion generada por springdoc
sonar.exclusions=**/*.class,**/generated/**,**/target/**
