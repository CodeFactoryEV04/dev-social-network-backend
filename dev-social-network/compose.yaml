services:
  postgres:
    image: 'postgres:16'
    env_file:
      - .env
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-codefactory}'
      - 'POSTGRES_USER=${POSTGRES_USER:-codefactory}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-codefactory}'
    ports:
      # El puerto del host sale de ${DB_PORT} del .env (5432 por defecto).
      # Dentro del contenedor Postgres SIEMPRE escucha en 5432.
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ------------------------------------------------------------
  # SonarQube
  # ------------------------------------------------------------
  sonarqube-db:
    image: 'postgres:16-alpine'
    profiles: ['sonar']
    environment:
      - 'POSTGRES_DB=${SONAR_DB_NAME:-sonarqube}'
      - 'POSTGRES_USER=${SONAR_DB_USER:-sonar}'
      - 'POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:-sonar}'
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonarqube}']
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: 'sonarqube:community'
    profiles: ['sonar']
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      - 'SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}'
      - 'SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}'
      - 'SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-sonar}'
    ports:
      - '${SONAR_PORT:-9000}:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_temp:/opt/sonarqube/temp

volumes:
  postgres_data:
  sonarqube_db:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:
