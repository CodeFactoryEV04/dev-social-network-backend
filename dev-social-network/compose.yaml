services:
  postgres:
    image: 'postgres:16'
    env_file:
      - .env
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-codefactory}'
      - 'POSTGRES_USER=${POSTGRES_USER:-codefactory}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-codefactory}'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
